# Publishes a GitHub release. Push a v* tag, or run it from the Actions tab with a tag name (the tag is created on main).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release, e.g. v0.2.1
        required: true
      notes:
        description: Release notes (Markdown); empty lists the merged pull requests
        required: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
