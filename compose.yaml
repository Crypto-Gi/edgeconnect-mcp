# HTTP mode in a container. Put mcp_http_token, mcp_http_allowed_clients and (behind a proxy)
# mcp_http_trusted_proxies in .env; see the README section "Run in a container".
services:
  edgeconnect-mcp:
    build: .
    image: edgeconnect-mcp
    command: ["--http", "8765"]
    env_file: .env
    ports:
      - "127.0.0.1:8765:8765"  # host loopback only; plain HTTP never leaves the machine
    volumes:
      - audit:/home/mcp/.edgeconnect-mcp
    restart: unless-stopped

volumes:
  audit:
